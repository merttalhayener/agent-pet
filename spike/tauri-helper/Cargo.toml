# THROWAWAY SPIKE: answers whether one Tauri helper can serve macOS and Windows.
[package]
name = "agent-pet-helper-spike"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
open = "5"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
